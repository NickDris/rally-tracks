name: "Changed Files"
on:
  push:
    branches: [ master, '[0-9]*' ]
  pull_request_target:
  # Allows triggering the job manually
  workflow_dispatch:

env:
  EXCLUDE_FOLDERS: ".github,.buildkite"

jobs:
  filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.9
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - run: echo "JAVA21_HOME=$JAVA_HOME_21_X64" >> $GITHUB_ENV
      - run: echo "JAVA11_HOME=$JAVA_HOME_11_X64" >> $GITHUB_ENV
      - name: "Install dependencies"
        run: python -m pip install .[develop]
      - name: Parse repo and create filters.yml
        run: python3 .github/scripts/track-filter.py
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: .github/filters.yml
      - name: Collect changed tracks for --track-filter argument
        id: track_filter
        run: |
          TRACKS=$(echo '${{ toJSON(steps.changes.outputs) }}' | jq -r '
            to_entries
            | map(select(.value == "true"))
            | map(.key)
            | join(",")
          ')
          echo "tracks=$TRACKS" >> $GITHUB_OUTPUT
      - name: "Run tests for tracks: ${{ steps.track_filter.outputs.tracks }}"
        run: hatch -v -e it run test --track-filter="${{ steps.track_filter.outputs.tracks }}"
