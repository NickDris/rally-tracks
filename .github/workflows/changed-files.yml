name: "Changed Files"
on:
  push:
    branches: [ master, '[0-9]*' ]
  pull_request_target:
  # Allows triggering the job manually
  workflow_dispatch:

env:
  EXCLUDE_FOLDERS: ".github,.buildkite"

jobs:
  filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dynamically parse tracks
        run: |
          python3 <<EOF
          import os, yaml
          exclude = set(os.environ.get('EXCLUDE_FOLDERS', '').split(','))
          filters = {}
          for entry in os.listdir('.'):
              if os.path.isdir(entry) and entry not in exclude:
                  filters[entry] = [f"{entry}/**"]
          with open('.github/filters.yml', 'w') as f:
              yaml.dump(filters, f, default_flow_style=False)
          EOF
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: .github/filters.yml
      - name: big5 tests
        run: |
          if [ "${{ steps.changes.outputs.big5 }}" = "true" ]; then
            echo "Running big5 tests..."
          fi
      - name: cohere_vector tests
        run: |
          if [ "${{ steps.changes.outputs.cohere_vector }}" = "true" ]; then
            echo "Running cohere_vector tests..."
          fi
      - name: dense_vector tests
